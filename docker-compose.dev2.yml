services:
  postgres:
    image: postgres:16
    container_name: zipline-postgres
    restart: always
    # Carica automaticamente tutte le variabili dal file .env nella stessa cartella
    env_file:
      - .env
    ports:
      # Espone il DB su localhost così la tua app node (pnpm dev) può vederlo
      - "127.0.0.1:5432:5432"
    environment:
      # Mappa le TUE variabili (dal .env) a quelle interne di POSTGRES
      POSTGRES_USER: ${POSTGRES_USER:-zipline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zipline_db}
    volumes:
      - zipline_data:/var/lib/postgresql/data

volumes:
  zipline_data:
